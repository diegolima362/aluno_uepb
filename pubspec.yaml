name: aluno_uepb
description: The app for students of the State University of Paraíba.

publish_to: "none"

environment:
  sdk: ">=3.5.0"

version: 1.6.0+20

dependencies:
  asp: 2.0.2
  auto_injector: 2.0.5
  collection: 1.19.0
  connectivity_plus: 6.0.5
  cupertino_icons: 1.0.8
  dynamic_color: 1.7.0
  dynamic_height_grid_view: ^0.0.4
  flutter:
    sdk: flutter
  flutter_local_notifications: 17.2.2
  flutter_localizations:
    sdk: flutter
  flutter_markdown: 0.7.3+1
  flutter_native_splash: 2.4.1
  flutter_secure_storage: 9.2.2
  flutter_timezone: 3.0.1
  gap: 3.0.1
  html: 0.15.4
  http: 1.2.2
  intl: 0.19.0
  markdown_widget: 2.3.2+6
  material_symbols_icons: 4.2785.1
  package_info_plus: 8.0.2
  path: 1.9.0
  path_provider: 2.1.4
  permission_handler: 11.3.1
  result_dart: 1.1.1
  routefly: 2.0.2
  sqflite: 2.3.3+1
  timezone: 0.9.4
  two_dimensional_scrollables: 0.3.2
  url_launcher: 6.3.0
  workmanager: 0.5.2

dev_dependencies:
  build_runner: 2.4.12
  flutter_lints: 4.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  mocktail: 1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_native_splash:
  color: "#ffffff"
  image: assets/images/app_logo.png
  color_dark: "#000000"
  image_dark: assets/images/app_logo_invert.png
  android: true
  android_gravity: center

  android_12:
    color: "#ffffff"
    image: assets/images/android12_splash.png
    icon_background_color: "#ffffff"

    image_dark: assets/images/android12_splash_inverse.png
    color_dark: "#000000"
    icon_background_color_dark: "#000000"
